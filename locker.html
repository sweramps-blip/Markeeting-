<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Buyer | Earn Money</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0a0e1a; color: white; font-family: 'Outfit', sans-serif; text-align: center; padding: 20px; }
        .container { background: #161b22; border-radius: 20px; padding: 25px; border: 1px solid #30363d; max-width: 450px; margin: auto; }
        .promo-img { width: 100%; border-radius: 15px; margin-bottom: 15px; border: 2px solid #25d366; }
        h2 { color: #fff; font-size: 22px; }
        p { color: #8b949e; font-size: 15px; }
        
        /* Progress Bar */
        .progress-container { background: #0d1117; border-radius: 10px; height: 25px; margin: 20px 0; overflow: hidden; border: 1px solid #30363d; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #25d366, #128c7e); transition: width 0.4s ease; }
        
        .share-btn { background: #25d366; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .share-btn:hover { transform: scale(1.02); background: #20bd5b; }
        
        #lock-msg { display: none; color: #ffcc00; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <i class="fas fa-envelope-open-text" style="font-size: 50px; color: #25d366;"></i>
    <h2>Gmail Buyer Portal</h2>
    <p>فریش جی میل بیچیں اور 50 سے 80 روپے فی جی میل کمائیں۔ لنک ان لاک کرنے کے لیے نیچے والا ٹاسک مکمل کریں:</p>

    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
    <p id="counter-text">0/10 Shares Remaining</p>

    <button class="share-btn" onclick="viralTask()">
        <i class="fab fa-whatsapp"></i> Share to WhatsApp
    </button>

    <p id="lock-msg">تصدیق ہو رہی ہے... براہ کرم انتظار کریں!</p>
</div>

<script type="text/javascript" src="https://ridefiles.net/script_include.php?id=1884668"></script>

<script>
    let currentShares = 0;
    const goal = 10;

    function viralTask() {
        const msg = "بھائی! ایک جی میل بنانے کے 80 روپے مل رہے ہیں۔ میں نے ابھی 900 روپے نکالے ہیں۔ آپ بھی آزمائیں: https://powerstar.pro"; // یہاں اپنا لنک بدلیں
        const wpUrl = "whatsapp://send?text=" + encodeURIComponent(msg);
        
        window.location.href = wpUrl;

        // شیئر کے بعد کا لاجک
        setTimeout(() => {
            if (currentShares < goal) {
                currentShares++;
                let progress = (currentShares / goal) * 100;
                document.getElementById('progress-bar').style.width = progress + '%';
                document.getElementById('counter-text').innerText = (goal - currentShares) + "/10 Shares Remaining";

                if (currentShares >= goal) {
                    completeTask();
                }
            }
        }, 2500);
    }

    function completeTask() {
        document.getElementById('lock-msg').style.display = 'block';
        document.getElementById('counter-text').innerText = "Task Completed!";
        
        // CPAGrip Locker کال کریں
        if (typeof call_locker === "function") {
            call_locker(); 
        } else {
            alert("آپ کا ٹاسک مکمل ہو گیا۔ اب آخری ویریفیکیشن مکمل کریں!");
        }
    }
</script>

</body>
</html>
