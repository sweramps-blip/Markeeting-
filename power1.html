<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wait & Watch</title>

<script>
// Page load → Adsterra open
window.onload = function() {
    window.open("https://www.profitablecpmratenetwork.com/upkwe9r2?key=75595a960030d604a751407ff4d7266b", "_blank");
}

// Timer
let timeLeft = 30;

function startTimer() {
    let timer = setInterval(function() {

        document.getElementById("count").innerHTML = timeLeft;
        timeLeft--;

        if (timeLeft < 0) {
            clearInterval(timer);

            // Timer khatam → YouTube open
            window.location.href = "https://youtu.be/FCwr-vZZ0yM";
        }

    }, 1000);
}
</script>

</head>

<body onload="startTimer()" style="text-align:center; font-family:Arial;">

<h2>Please Wait...</h2>
<p>Video will start in <span id="count">30</span> seconds</p>

</body>
</html>
