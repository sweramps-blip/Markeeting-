<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Continue to Video</title>

<script>
let timeLeft = 30;

function startProcess() {
    // Adsterra link open (user click ke sath → block nahi hoga)
    window.open("https://www.profitablecpmratenetwork.com/fgnsd0zn?key=040535026948793c010dcd8d1c86e224", "_blank");

    // Timer start
    let timer = setInterval(function() {
        document.getElementById("count").innerHTML = timeLeft;
        timeLeft--;

        if (timeLeft < 0) {
            clearInterval(timer);
            document.getElementById("btn").style.display = "block";
        }
    }, 1000);

    document.getElementById("startBtn").style.display = "none";
}

function openVideo() {
    window.location.href = "https://youtu.be/vJ9_NW82Jks";
}
</script>

</head>

<body style="text-align:center; font-family:Arial;">

<h2>Watch Video</h2>

<button id="startBtn" onclick="startProcess()">Click to Continue</button>

<p>Video unlock in <span id="count">30</span> seconds</p>

<button id="btn" onclick="openVideo()" style="display:none;">
    Watch Now
</button>

</body>
</html>
